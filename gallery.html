<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | dimakeupinsalma</title>
    <link rel="icon" type="image/x-icon" href="images/logomakeup.jpg">
    <link rel="stylesheet" href="styleuts.css"> 
</head>
<body>
    <div class="utama">
        <h2>Gallery</h2>
        <p>Koleksi hasil makeup, hairdo, dan hijabdo dari dimakeupinsalma.</p>

        <h2 id="regular">Makeup Regular</h2>
        <div class="deret">
            <div class="product-photo">
                <img src="images/makeupregular1.jpg" alt="Makeup Regular 1" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupregular2.jpg" alt="Makeup Regular 2" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupkondangan.jpg" alt="Makeup Regular 3" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupregularr.jpg" alt="Makeup Regular 4" width="200">
            </div>
        </div>

        <h2 id="special">Makeup Special Occasion</h2>
        <div class="deret">
            <div class="product-photo">
                <img src="images/makeupspeciall.jpg" alt="Special Occasion 1" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupsiraman.jpg" alt="Special Occasion 2" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupspecial3.jpg" alt="Special Occasion 3" width="200">
            </div>
        </div>

        <h2 id="akad">Makeup Akad / Resepsi</h2>
        <div class="deret">
            <div class="product-photo">
                <img src="images/makeupakadsunda.jpg" alt="Akad 1" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupakad.jpg" alt="Akad 2" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupakad2.jpg" alt="Akad 3" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupresepsi.jpg" alt="Akad 4" width="200">
            </div>
            <div class="product-photo">
                <img src="images/makeupakaddd.jpg" alt="Akad 5" width="200">
            </div>
        </div>

        <h2 id="hairdo">Hairdo</h2>
        <div class="deret">
            <div class="product-photo">
                <img src="images/hairdo2.jpg" alt="Hairdo 1" width="200">
            </div>
            <div class="product-photo">
                <img src="images/hairdo.jpg" alt="Hairdo 2" width="200">
            </div>
            <div class="product-photo">
                <img src="images/hairdo1.jpg" alt="Hairdo 3" width="200">
            </div>
        </div>

        <h2 id="hijabdo">Hijabdo</h2>
        <div class="deret">
            <div class="product-photo">
                <img src="images/hijabdo1.jpg" alt="Hijabdo 1" width="200">
            </div>
            <div class="product-photo">
                <img src="images/hijabdo2.jpg" alt="Hijabdo 2" width="200">
            </div>
            <div class="product-photo">
                <img src="images/hijabdo3.jpg" alt="Hijabdo 3" width="200">
            </div>
        </div>
